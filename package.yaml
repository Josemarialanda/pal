# package.yaml — for PAL
# Run `hpack` to generate .cabal

name: pal
version: 0.0.0
synopsis: A meta-DSL for defining, exploring, and experimenting with type systems and languages within Haskell.
description: |
  PAL is a meta-DSL for defining, exploring, and experimenting with type systems and languages within Haskell.
license: NONE
author: José María Landa Chávez
maintainer: José María Landa Chávez <josemaria.landa@gmail.com>
copyright: 2025-10-04 José María Landa Chávez
extra-source-files:
  # Embedded into pal-ui at compile time.
  - ui/static/*
extra-doc-files:
  - README.md
tested-with:
  - GHC == 9.8.4

dependencies:
  - base >= 4.9 && < 5
  - polysemy

default-extensions: [
    DataKinds,
    TypeOperators,
    ScopedTypeVariables,
    TypeApplications,
    RecordWildCards,
    OverloadedStrings,
    PatternSynonyms,
    PolyKinds,
    FlexibleContexts,
    ConstraintKinds,
    ViewPatterns,
    LambdaCase,
    GeneralizedNewtypeDeriving,
    TupleSections,
    InstanceSigs,
    DeriveFunctor,
    NamedFieldPuns,
    TypeFamilies,
    FlexibleInstances,
    UndecidableInstances,
    DeriveDataTypeable,
    OverloadedRecordDot,
    TemplateHaskell,
    MultiWayIf,
    GADTs,
    RankNTypes,
  ]
ghc-options: [-Wall, -Werror]
language: Haskell2010

library:
  source-dirs: src
  exposed-modules:
    [PAL, Types, Program, Pretty, Report, Repl, Interpreters.Common.Actions, Interpreters.Common.Terms, Interpreters.Common.Reduce, Interpreters.Common.InferMonad, Interpreters.Common.Unify, Interpreters.Common.Relations, Interpreters.Common.Inference, Interpreters.Common.Definitions, Interpreters.Common.Expectations, Interpreters.Common.Metatheory, Interpreters.Common.Search, Interpreters.Core, Interpreters.Debug, Interpreters.IO, Parser.Parser, Parser.Data, Parser.Quasi, Parser.Types]
  other-modules:
    [Utils.OneOfN]
  dependencies:
    - free
    - containers
    - lens
    - text
    - template-haskell
    - megaparsec
    - haskeline

executables:
  pal:
    source-dirs: app
    main: Main.hs
    dependencies:
      - pal

  pal-examples:
    source-dirs: examples
    main: Main.hs
    other-modules:
      [Examples.Types, Examples.AsCode, Examples.AsData, Examples.AsDSL, Examples.AsFile]
    dependencies:
      - pal
      - filepath

  pal-ui:
    source-dirs: ui
    main: Main.hs
    other-modules:
      [Ui.Embed, Ui.Json, Ui.Http, Ui.Themes, Ui.Api]
    dependencies:
      - pal
      - network
      - bytestring
      - text
      - process
      - template-haskell
      - directory
      - filepath
      - megaparsec
    ghc-options: [-threaded]

tests:
  pal-properties:
    source-dirs: tests/properties
    main: Main.hs
    dependencies:
      - pal
      - QuickCheck
      - megaparsec
      - containers
